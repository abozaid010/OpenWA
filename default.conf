upstream api_backend {
    server lenaai-app:8080;
}

upstream website_frontend {
    server lenaai_website:3000;
}

upstream webhook {
    server whatsapp_container:80;
}

upstream openwa_dashboard {
    server openwa-dashboard:80;
}

server {
    listen 80;
    server_name api.lenaai.net;

    location /health {
        proxy_pass http://api_backend/health;
    }

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name www.lenaai.net lenaai.net;

    location / {
        proxy_pass http://website_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name openwa.lenaai.net;

    location / {
        proxy_pass http://openwa_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

